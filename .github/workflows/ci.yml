# CI: tests on Windows, macOS and Linux, the standalone binaries for every platform, the native
# macOS app, and the Windows binary and installers on a real Windows machine.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # The Bun that compiles the standalone binaries (bump it here and in release.yml together).
  BUN_VERSION: "1.4.4"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  binaries:
    name: Binaries (all platforms)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: npm ci
      - name: Build every target
        run: bun scripts/build-binaries.ts --target=all --outdir=dist-bin --smoke
      - name: Smoke test the Linux binary
        run: |
          ./dist-bin/lu-minal-linux-x64 --version
          ./dist-bin/lu-minal-linux-x64 --help | head -n 3
          (cd dist-bin && sha256sum -c SHA256SUMS)
      - name: Smoke test the musl binary on Alpine
        # Bun's musl runtime links libstdc++, which Alpine installs on demand.
        run: docker run --rm -v "$PWD/dist-bin:/bin-lu:ro" alpine:3 sh -c "apk add --no-cache libstdc++ >/dev/null && /bin-lu/lu-minal-linux-x64-musl --version"
      - name: Install with install.sh from the local build
        env:
          LU_MINAL_BASE_URL: ${{ github.workspace }}/dist-bin
          LU_MINAL_INSTALL_DIR: ${{ runner.temp }}/lu-minal-bin
          LU_MINAL_NO_DESKTOP: "1"
        run: |
          sh install.sh
          "$LU_MINAL_INSTALL_DIR/lu-minal" --version
      - uses: actions/upload-artifact@v4
        with:
          name: lu-minal-binaries
          path: dist-bin/
          if-no-files-found: error
          retention-days: 5

  macos-app:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: npm ci
      - name: Toolchain
        id: toolchain
        run: |
          sw_vers
          xcodebuild -version || true
          swift --version
          # Part of the cache key: modules built by another Swift compiler cannot be reused.
          echo "swift=$(swift --version 2>&1 | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: macos/.build
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.swift }}-${{ hashFiles('macos/Package.swift', 'macos/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.swift }}-
      - name: Test the cloud pane's escape-sequence filter and URL policy
        run: bash macos/scripts/test-pane.sh
      - name: Build the macOS binaries (arm64 and x64)
        run: |
          bun scripts/build-binaries.ts --target=macos --outdir=dist-bin --smoke
          codesign --verify --verbose=2 dist-bin/lu-minal-macos-arm64 dist-bin/lu-minal-macos-x64
      - name: Build, bundle and sign LuMinal.app
        run: bash macos/scripts/bundle-app.sh --binary dist-bin/lu-minal-macos-arm64 --binary dist-bin/lu-minal-macos-x64 --out dist-app
      - name: Check the bundle
        run: |
          plutil -p dist-app/LuMinal.app/Contents/Info.plist
          codesign --display --verbose=2 dist-app/LuMinal.app
          lipo -info dist-app/LuMinal.app/Contents/MacOS/LuMinal dist-app/LuMinal.app/Contents/Resources/bin/lu-minal
          dist-app/LuMinal.app/Contents/Resources/bin/lu-minal --version
      - name: Install with install.sh from the local build
        env:
          LU_MINAL_BASE_URL: ${{ github.workspace }}/dist-bin
          LU_MINAL_INSTALL_DIR: ${{ runner.temp }}/lu-minal-bin
        run: |
          sh install.sh
          "$LU_MINAL_INSTALL_DIR/lu-minal" --version
      - uses: actions/upload-artifact@v4
        with:
          name: lu-minal-macos-app
          path: dist-app/lu-minal-macos-app.zip
          if-no-files-found: error
          retention-days: 5

  windows-smoke:
    name: Windows binary and installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: npm ci
      - name: Build the Windows binary (with version info)
        run: bun scripts/build-binaries.ts --target=windows-x64 --outdir=dist-bin --smoke
      - name: Run lu-minal.exe --version
        shell: pwsh
        run: |
          Copy-Item dist-bin\lu-minal-windows-x64.exe "$env:RUNNER_TEMP\lu-minal.exe"
          & "$env:RUNNER_TEMP\lu-minal.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "lu-minal.exe --version failed" }
          (Get-Item "$env:RUNNER_TEMP\lu-minal.exe").VersionInfo | Format-List ProductName, FileVersion, CompanyName
      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'rustup could not install the stable toolchain' }
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
          rustc --version
          cargo --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows-app
      - name: Build the window app (lu-minal-window.exe)
        shell: pwsh
        run: |
          node scripts/windows-app-assets.mjs
          if ($LASTEXITCODE -ne 0) { throw 'the window app assets could not be prepared' }
          cargo test --manifest-path windows-app/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { throw 'the window app tests failed' }
          cargo build --manifest-path windows-app/Cargo.toml --locked --release --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'cargo build failed for the window app' }
          New-Item -ItemType Directory -Force dist-window | Out-Null
          Copy-Item windows-app\target\x86_64-pc-windows-msvc\release\lu-minal-window.exe dist-window\lu-minal-window-x64.exe
          Get-Item dist-window\lu-minal-window-x64.exe | Format-List Name, Length
          (Get-Item dist-window\lu-minal-window-x64.exe).VersionInfo | Format-List ProductName, ProductVersion, FileVersion
      - name: Smoke test the window app (both web views, ConPTY, OSC 7701)
        shell: pwsh
        run: |
          # The app next to the freshly built lu-minal.exe, as the setup installs them.
          $dir = Join-Path $env:RUNNER_TEMP 'lu-minal-window'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item dist-window\lu-minal-window-x64.exe (Join-Path $dir 'lu-minal-window.exe')
          Copy-Item dist-bin\lu-minal-windows-x64.exe (Join-Path $dir 'lu-minal.exe')
          $version = node -p "require('./package.json').version"
          # --smoke: lu-minal.exe --version must reach xterm.js; --smoke-osc: node prints OSC 7701
          # sequences, ConPTY passes them on, the window takes them out and refuses the bad URL.
          $expected = @{ 'smoke' = "smoke ok $version"; 'smoke-osc' = 'smoke ok osc' }
          foreach ($kind in 'smoke', 'smoke-osc') {
            $out = Join-Path $env:RUNNER_TEMP "lu-minal-window-$kind.txt"
            Remove-Item -LiteralPath $out -ErrorAction SilentlyContinue
            # A GUI program: PowerShell would not wait for it, so it writes its result to a file.
            $p = Start-Process -FilePath (Join-Path $dir 'lu-minal-window.exe') -ArgumentList "--$kind=`"$out`"" -PassThru
            $null = $p.Handle
            if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "lu-minal-window.exe --$kind did not end" }
            $result = if (Test-Path -LiteralPath $out) { (Get-Content -Raw -LiteralPath $out).Trim() } else { '(no result file)' }
            Write-Host "--$kind -> exit $($p.ExitCode): $result"
            if ($p.ExitCode -ne 0 -or $result -ne $expected[$kind]) { throw "lu-minal-window.exe --$kind failed: $result" }
          }
      - name: install.ps1 in Windows PowerShell 5.1 (irm | iex style)
        shell: powershell
        env:
          LU_MINAL_BASE_URL: ${{ github.workspace }}\dist-bin
          LU_MINAL_INSTALL_DIR: ${{ runner.temp }}\lu-minal-ps5
          LU_MINAL_NO_PATH: "1"
          LU_MINAL_WINDOWS_TERMINAL: "1"
        run: |
          Get-Content -Raw -LiteralPath .\install.ps1 | Invoke-Expression
          & "$env:LU_MINAL_INSTALL_DIR\lu-minal.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "the installed lu-minal.exe did not start" }
          $fragment = Join-Path $env:LOCALAPPDATA 'Microsoft\Windows Terminal\Fragments\lu-minal\lu-minal.json'
          if (-not (Test-Path -LiteralPath $fragment)) { throw "no Windows Terminal fragment at $fragment" }
          $json = Get-Content -Raw -LiteralPath $fragment | ConvertFrom-Json
          if ($json.profiles[0].colorScheme -ne 'Moon Dark') { throw 'the fragment has the wrong colour scheme' }
          Write-Host $json.profiles[0].commandline
      - name: install.ps1 in PowerShell 7 (PATH update)
        shell: pwsh
        env:
          LU_MINAL_BASE_URL: ${{ github.workspace }}\dist-bin
          LU_MINAL_INSTALL_DIR: ${{ runner.temp }}\lu-minal-ps7
          LU_MINAL_WINDOWS_TERMINAL: "0"
        run: |
          Get-Content -Raw -LiteralPath .\install.ps1 | Invoke-Expression
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (-not ($userPath -split ';' | Where-Object { $_.TrimEnd('\') -ieq $env:LU_MINAL_INSTALL_DIR.TrimEnd('\') })) {
            throw "install.ps1 did not add $env:LU_MINAL_INSTALL_DIR to the user PATH"
          }
          lu-minal.exe --version
          if ($LASTEXITCODE -ne 0) { throw "lu-minal.exe is not on the PATH of this session" }
      - name: Inno Setup
        shell: pwsh
        run: |
          # On the runner image already, or from Chocolatey.
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Chocolatey could not install Inno Setup' }
          }
          if (-not (Test-Path -LiteralPath $iscc)) { throw "no ISCC.exe at $iscc" }
          "ISCC=$iscc" >> $env:GITHUB_ENV
      - name: Build the installer
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          & $env:ISCC /Q "/DAppVersion=$version" /DArch=x64 windows\lu-minal.iss
          if ($LASTEXITCODE -ne 0) { throw 'ISCC failed' }
          Get-Item dist-bin\lu-minal-windows-x64-setup.exe | Format-List Name, Length
          (Get-Item dist-bin\lu-minal-windows-x64-setup.exe).VersionInfo | Format-List ProductName, ProductVersion, FileVersion
      - name: Install silently, check everything, uninstall
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'lu-minal-setup'
          $log = Join-Path $env:RUNNER_TEMP 'lu-minal-setup.log'
          $setup = Start-Process -FilePath dist-bin\lu-minal-windows-x64-setup.exe -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS="path,terminal"', "/DIR=`"$dir`"", "/LOG=`"$log`""
          )
          if ($setup.ExitCode -ne 0) { Get-Content -LiteralPath $log -Tail 60; throw "setup exited with $($setup.ExitCode)" }

          $exe = Join-Path $dir 'lu-minal.exe'
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw 'the installed lu-minal.exe did not start' }
          $onPath = { ([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') | Where-Object { $_.TrimEnd('\') -ieq $dir } }
          if (-not (& $onPath)) { throw "setup did not add $dir to the user PATH" }
          $fragment = Join-Path $env:LOCALAPPDATA 'Microsoft\Windows Terminal\Fragments\lu-minal\lu-minal.json'
          $profileLine = (Get-Content -Raw -LiteralPath $fragment | ConvertFrom-Json).profiles[0].commandline
          if ($profileLine -notlike "*$dir*") { throw "the Windows Terminal profile doesn't start the installed exe: $profileLine" }
          $window = Join-Path $dir 'lu-minal-window.exe'
          if (-not (Test-Path -LiteralPath $window)) { throw "setup did not install $window" }
          (Get-Item -LiteralPath $window).VersionInfo | Format-List ProductName, ProductVersion, FileVersion
          $shell = New-Object -ComObject WScript.Shell
          $programs = [Environment]::GetFolderPath('Programs')
          $shortcut = Join-Path $programs 'lu-minal.lnk'
          if (-not (Test-Path -LiteralPath $shortcut)) { throw "no Start menu shortcut at $shortcut" }
          $target = $shell.CreateShortcut($shortcut).TargetPath
          if ($target -ine $window) { throw "the Start menu shortcut opens $target, not the window app" }
          # The second entry: Windows Terminal with lu-minal's profile when it is installed, else the console.
          $second = @('lu-minal in Windows Terminal.lnk', 'lu-minal in the console.lnk') | ForEach-Object { Join-Path $programs $_ } | Where-Object { Test-Path -LiteralPath $_ }
          if (@($second).Count -ne 1) { throw "expected one 'lu-minal in Windows Terminal' or 'lu-minal in the console' entry, found $(@($second).Count)" }
          $secondTarget = $shell.CreateShortcut(@($second)[0]).TargetPath
          if ($secondTarget -notlike '*\wt.exe' -and $secondTarget -ine $exe) { throw "the second Start menu entry opens $secondTarget" }
          Write-Host "Start menu: $shortcut -> $target; $(@($second)[0]) -> $secondTarget"
          $apps = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall'
          $entry = Get-ChildItem $apps | Where-Object { $_.GetValue('DisplayName') -eq 'lu-minal' }
          if (-not $entry) { throw 'no lu-minal entry in Settings > Apps' }
          Write-Host "Installed: $($entry.GetValue('DisplayVersion')) in $($entry.GetValue('InstallLocation'))"

          # An update while the window app (and lu-minal in it) runs, as lu-minal's own updater
          # does it: the setup moves the running exes aside and puts the new ones in their place.
          $env:LU_MINAL_NO_UPDATE_CHECK = '1'
          $running = Start-Process -FilePath $window -WorkingDirectory $env:RUNNER_TEMP -PassThru
          $null = $running.Handle
          Start-Sleep -Seconds 10
          if ($running.HasExited) { throw "lu-minal-window.exe ended by itself (exit $($running.ExitCode))" }
          $setup = Start-Process -FilePath dist-bin\lu-minal-windows-x64-setup.exe -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$dir`"", "/LOG=`"$log`""
          )
          if ($setup.ExitCode -ne 0) { Get-Content -LiteralPath $log -Tail 60; throw "the update over the running window exited with $($setup.ExitCode)" }
          $aside = @(Get-ChildItem -LiteralPath $dir -Filter 'lu-minal-window.old*.exe')
          Write-Host "After the update: $((Get-ChildItem -LiteralPath $dir -Name) -join ', ')"
          if ($aside.Count -ne 1) { throw 'the running lu-minal-window.exe was not moved aside' }
          if (-not (Test-Path -LiteralPath $window)) { throw 'the update left no lu-minal-window.exe' }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw 'lu-minal.exe does not start after the update' }
          if ($running.HasExited) { throw 'the update stopped the running window' }
          # Close the window and lu-minal (running from the moved copies) before uninstalling.
          Stop-Process -Id $running.Id -Force -ErrorAction SilentlyContinue
          Get-Process | Where-Object { $_.Path -and $_.Path.StartsWith($dir, [StringComparison]::OrdinalIgnoreCase) } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

          # The uninstaller copies itself to a temp folder and goes on from there: wait for the files.
          $uninstall = Start-Process -FilePath (Join-Path $dir 'unins000.exe') -Wait -PassThru -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART')
          if ($uninstall.ExitCode -ne 0) { throw "the uninstaller exited with $($uninstall.ExitCode)" }
          $until = (Get-Date).AddSeconds(90)
          while (((Test-Path -LiteralPath $exe) -or (Get-ChildItem $apps | Where-Object { $_.GetValue('DisplayName') -eq 'lu-minal' })) -and (Get-Date) -lt $until) {
            Start-Sleep -Milliseconds 500
          }
          if (Test-Path -LiteralPath $exe) { throw 'the uninstaller left lu-minal.exe behind' }
          if (Test-Path -LiteralPath $window) { throw 'the uninstaller left lu-minal-window.exe behind' }
          if (Get-ChildItem -LiteralPath $dir -Filter '*.old*.exe' -ErrorAction SilentlyContinue) { throw 'the uninstaller left moved-aside copies behind' }
          if ($second | Where-Object { Test-Path -LiteralPath $_ }) { throw 'the uninstaller left the second Start menu entry behind' }
          if (& $onPath) { throw "the uninstaller left $dir on the user PATH" }
          if (Test-Path -LiteralPath $fragment) { throw 'the uninstaller left the Windows Terminal profile behind' }
          if (Test-Path -LiteralPath $shortcut) { throw 'the uninstaller left the Start menu shortcut behind' }
          if (Get-ChildItem $apps | Where-Object { $_.GetValue('DisplayName') -eq 'lu-minal' }) { throw 'the Settings > Apps entry is still there' }
          if (Test-Path -LiteralPath 'HKCU:\Software\Luna-OS\lu-minal') { throw "the uninstaller left lu-minal's registry key behind" }
          Write-Host 'Installed, checked and uninstalled.'

          # Over install.ps1's copy: the PowerShell 7 step installed one in lu-minal-ps7 and put that
          # folder on the PATH. The setup updates it in place; its uninstaller removes the emptied
          # folder but leaves the PATH entry it did not add.
          $ps = Join-Path $env:RUNNER_TEMP 'lu-minal-ps7'
          $psExe = Join-Path $ps 'lu-minal.exe'
          if (-not (Test-Path -LiteralPath $psExe)) { throw 'install.ps1 left no copy to update' }
          $psOnPath = { @(([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') | Where-Object { $_.TrimEnd('\') -ieq $ps }).Count }
          $setup = Start-Process -FilePath dist-bin\lu-minal-windows-x64-setup.exe -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS="path"', "/DIR=`"$ps`"", "/LOG=`"$log`""
          )
          if ($setup.ExitCode -ne 0) { Get-Content -LiteralPath $log -Tail 60; throw "setup over install.ps1's copy exited with $($setup.ExitCode)" }
          & $psExe --version
          if ($LASTEXITCODE -ne 0) { throw 'the updated lu-minal.exe did not start' }
          if ((& $psOnPath) -ne 1) { throw "the PATH should list $ps once, it lists it $(& $psOnPath) times" }
          $uninstall = Start-Process -FilePath (Join-Path $ps 'unins000.exe') -Wait -PassThru -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART')
          if ($uninstall.ExitCode -ne 0) { throw "the uninstaller exited with $($uninstall.ExitCode)" }
          $until = (Get-Date).AddSeconds(90)
          while ((Test-Path -LiteralPath $ps) -and (Get-Date) -lt $until) { Start-Sleep -Milliseconds 500 }
          if (Test-Path -LiteralPath $ps) { throw "the uninstaller left the emptied folder behind: $(Get-ChildItem -LiteralPath $ps -Force | Out-String)" }
          if ((& $psOnPath) -ne 1) { throw 'the uninstaller took a PATH entry it had not added' }
          Write-Host "Updated install.ps1's copy and uninstalled it; its PATH entry stayed."
