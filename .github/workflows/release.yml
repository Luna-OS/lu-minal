# Release: on a version tag (v0.2.0), or started by hand with the version (Actions tab or API;
# the release then creates the tag on the commit it built), build the standalone binaries for
# every platform, the macOS app (zip and disk image), the Windows setups (with lu-minal's window
# app inside), compute SHA256SUMS and publish a GitHub release. Windows
# binaries are built on Windows so they carry version info; macOS ones on macOS so they are
# signed there (ad-hoc) and can be combined into the app's universal binary.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release, as in package.json (0.2.0); the tag v0.2.0 is created on the chosen branch's commit"
        required: true
        type: string

# Read-only for every job; only publish gets a write token (npm ci's install scripts, the tests and
# the bundlers run in the others).
permissions:
  contents: read

env:
  BUN_VERSION: "1.4.4"

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: version
        name: The tag must match package.json
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
        run: |
          tag="${TAG#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $TAG does not match package.json's version $pkg"
            exit 1
          fi
          echo "version=$pkg" >> "$GITHUB_OUTPUT"

  # CI does not run for tags (it is limited to branches), so the tagged commit is tested here.
  test:
    name: Test (${{ matrix.os }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  linux:
    name: Linux binaries
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: npm ci
      - run: bun scripts/build-binaries.ts --target=linux --outdir=dist-bin --smoke
      - name: Smoke test the musl binary on Alpine
        # Bun's musl runtime links libstdc++, which Alpine installs on demand.
        run: docker run --rm -v "$PWD/dist-bin:/bin-lu:ro" alpine:3 sh -c "apk add --no-cache libstdc++ >/dev/null && /bin-lu/lu-minal-linux-x64-musl --version"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist-bin/lu-minal-*
          if-no-files-found: error

  windows:
    name: Windows binaries
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: npm ci
      - run: bun scripts/build-binaries.ts --target=windows --outdir=dist-bin --smoke
      # lu-minal's window (windows-app/) ships only inside the setups, so it is built into
      # dist-window/, which the release files (dist-bin/lu-minal-*) leave out.
      - name: Rust toolchain (x64 and arm64)
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'rustup could not install the stable toolchain' }
          rustup default stable
          rustup target add x86_64-pc-windows-msvc aarch64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'rustup could not add the Windows targets' }
          rustc --version
      - name: The window app (lu-minal-window.exe for x64 and arm64)
        shell: pwsh
        env:
          LU_MINAL_VERSION: ${{ needs.version.outputs.version }}
        run: |
          node scripts/windows-app-assets.mjs
          if ($LASTEXITCODE -ne 0) { throw 'the window app assets could not be prepared' }
          cargo test --manifest-path windows-app/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { throw 'the window app tests failed' }
          New-Item -ItemType Directory -Force dist-window | Out-Null
          foreach ($pair in @(@('x64', 'x86_64-pc-windows-msvc'), @('arm64', 'aarch64-pc-windows-msvc'))) {
            $arch, $triple = $pair
            cargo build --manifest-path windows-app/Cargo.toml --locked --release --target $triple
            if ($LASTEXITCODE -ne 0) { throw "cargo build failed for $triple" }
            Copy-Item "windows-app\target\$triple\release\lu-minal-window.exe" "dist-window\lu-minal-window-$arch.exe"
          }
          Get-ChildItem dist-window | Format-Table Name, Length
      - name: Smoke test the x64 window app
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'lu-minal-window'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item dist-window\lu-minal-window-x64.exe (Join-Path $dir 'lu-minal-window.exe')
          Copy-Item dist-bin\lu-minal-windows-x64.exe (Join-Path $dir 'lu-minal.exe')
          $out = Join-Path $env:RUNNER_TEMP 'lu-minal-window-smoke.txt'
          $p = Start-Process -FilePath (Join-Path $dir 'lu-minal-window.exe') -ArgumentList "--smoke=`"$out`"" -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'lu-minal-window.exe --smoke did not end' }
          $result = if (Test-Path -LiteralPath $out) { (Get-Content -Raw -LiteralPath $out).Trim() } else { '(no result file)' }
          Write-Host "--smoke -> exit $($p.ExitCode): $result"
          if ($p.ExitCode -ne 0 -or $result -ne "smoke ok $env:VERSION") { throw "lu-minal-window.exe --smoke failed: $result" }
      - name: Inno Setup
        shell: pwsh
        run: |
          # On the runner image already, or from Chocolatey.
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Chocolatey could not install Inno Setup' }
          }
          if (-not (Test-Path -LiteralPath $iscc)) { throw "no ISCC.exe at $iscc" }
          "ISCC=$iscc" >> $env:GITHUB_ENV
      - name: The installers (lu-minal-windows-x64-setup.exe, lu-minal-windows-arm64-setup.exe)
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          foreach ($arch in 'x64', 'arm64') {
            & $env:ISCC /Q "/DAppVersion=$env:VERSION" "/DArch=$arch" windows\lu-minal.iss
            if ($LASTEXITCODE -ne 0) { throw "ISCC failed for $arch" }
          }
          Get-ChildItem dist-bin\lu-minal-windows-*-setup.exe | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist-bin/lu-minal-*
          if-no-files-found: error

  macos:
    name: macOS binaries and app
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: npm ci
      # build-binaries.ts signs the macOS binaries ad-hoc when it runs on macOS.
      - run: bun scripts/build-binaries.ts --target=macos --outdir=dist-bin --smoke
      - name: Check the signatures
        run: |
          codesign --verify --verbose=2 dist-bin/lu-minal-macos-arm64 dist-bin/lu-minal-macos-x64
          codesign --display --verbose=2 dist-bin/lu-minal-macos-arm64
      - name: Build LuMinal.app (zip and disk image)
        run: >-
          bash macos/scripts/bundle-app.sh
          --binary dist-bin/lu-minal-macos-arm64 --binary dist-bin/lu-minal-macos-x64
          --version "${{ needs.version.outputs.version }}" --out dist-app --dmg
      # One flat folder: an artifact made from several folders keeps them as subfolders.
      - name: Collect the release files
        run: |
          mkdir -p release
          cp dist-bin/lu-minal-macos-arm64 dist-bin/lu-minal-macos-x64 release/
          cp dist-app/lu-minal-macos-app.zip dist-app/lu-minal-macos-app.dmg release/
          ls -la release
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: release/
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [version, test, linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: assets
        run: |
          rm -f SHA256SUMS
          ls -la
          for f in lu-minal-linux-x64 lu-minal-linux-arm64 lu-minal-linux-x64-musl lu-minal-linux-arm64-musl \
                   lu-minal-macos-x64 lu-minal-macos-arm64 lu-minal-windows-x64.exe lu-minal-windows-arm64.exe \
                   lu-minal-windows-x64-setup.exe lu-minal-windows-arm64-setup.exe \
                   lu-minal-macos-app.zip lu-minal-macos-app.dmg; do
            [ -f "$f" ] || { echo "::error::missing release file $f"; exit 1; }
          done
          sha256sum lu-minal-* > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: lu-minal ${{ needs.version.outputs.version }}
          # The tag (created here when the release was started by hand) is the commit that was tested.
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
