# lu-minal's own window on Windows (lu-minal-window.exe): the terminal (xterm.js in WebView2) with
# lu-minal running in a ConPTY on the left, the Claude Code website (claude.ai/code) in a second
# WebView2 on the right. See README.md. The version comes from the repository's package.json
# (build.rs), so this file's version is not bumped by releases.
[package]
name = "lu-minal-window"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "lu-minal's window on Windows: the terminal and the Claude Code website side by side"
repository = "https://github.com/Luna-OS/lu-minal"
publish = false
build = "build.rs"

[[bin]]
name = "lu-minal-window"
path = "src/main.rs"

# Pure logic (OSC parser, URL rules, settings, layout), tested on any OS with `cargo test`.
[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
url = "=2.5.8"

# The window itself only builds for Windows.
[target.'cfg(windows)'.dependencies]
tao = { version = "=0.37.2", default-features = false, features = ["rwh_06"] }
wry = { version = "=0.57.1", default-features = false }
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Console",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows-version = "=0.1.7"
portable-pty = "=0.9.0"
base64 = "=0.23.1"

[build-dependencies]
serde_json = "=1.0.154"
winresource = "=0.1.34"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
